<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Mythical Whale Stack</title>
  <style>
    /* RESET + GLOBAL */
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Tahoma,sans-serif}
    html,body{width:100%;height:100%;overflow-x:hidden;background:#0a1a24;color:#fff}

    /* HERO */
    .home-page{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;background:linear-gradient(135deg,#001221 0%,#003d5c 50%,#00799e 100%)}
    .home-page h1{font-size:clamp(2.5rem,6vw,4rem);margin-bottom:.75rem;letter-spacing:2px;text-shadow:0 4px 8px rgba(0,0,0,.4)}
    .home-page p{max-width:600px;line-height:1.55;font-size:1.15rem;opacity:.9}
    .scroll-indicator{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);animation:bounce 2s infinite}
    @keyframes bounce{0%,20%,50%,80%,100%{transform:translate(-50%,0)}40%{transform:translate(-50%,-20px)}60%{transform:translate(-50%,-10px)}}

    /* CARDS */
    .cards-container{position:relative;height:100vh;width:100%;overflow:hidden;background:#0a1a24;--bg:url("")}
    .cards-container::before{content:"";position:absolute;inset:0;background-image:var(--bg);background-size:cover;background-position:center;filter:blur(30px) brightness(.7);transform:scale(1.15);z-index:-1;transition:background-image .6s ease}

    .card{position:absolute;width:100%;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;will-change:transform;transition:transform .45s ease,opacity .45s ease}
    .card-image{
      height:calc(100% - 10vh);
      max-height:100vh;
      width:auto;
      max-width:100vw;
      object-fit:cover;
      border:8px solid rgba(255,255,255,.35);
      border-radius:14px;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
      transition:height .45s ease,width .45s ease
    }
    .card-details{position:absolute;bottom:0;left:0;width:100%;height:60vh;padding:1.75rem 1.25rem 2.5rem;background:rgba(255,255,255,.15);backdrop-filter:blur(12px);color:#f0f0f0;transform:translateY(100%);transition:transform .45s ease;overflow-y:auto}
    .card-details h2{font-size:2rem;margin-bottom:.6rem;color:#fff}
    .card-details p{line-height:1.65}
    .card.expanded .card-image{height:40vh}
    .card.expanded .card-details{transform:translateY(0)}
    .card.swipe-left{transform:translateX(-120%) rotate(-12deg);opacity:0}
    .card.swipe-right{transform:translateX(120%) rotate(12deg);opacity:0}

    /* COUNTER */
    .card-counter{position:absolute;top:1rem;left:50%;transform:translateX(-50%);padding:.35rem 1rem;border-radius:1rem;background:rgba(0,0,0,.55);font-size:.875rem;z-index:20}

    /* ARROW BUTTONS */
    .nav-btn{position:fixed;top:50%;transform:translateY(-50%);width:70px;height:70px;border:none;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s ease; z-index: 100;}
    .nav-btn.visible{opacity:.85;pointer-events:auto;}
    .nav-btn svg{width:38px;height:38px;stroke:white;stroke-opacity:.9}
    .nav-btn:hover{opacity:1}
    .nav-btn.left{left:15px}
    .nav-btn.right{right:15px;transform:translateY(-50%) rotate(180deg)}

    /* SCROLLBAR */
    .card-details::-webkit-scrollbar{width:6px}
    .card-details::-webkit-scrollbar-thumb{background:#888;border-radius:3px}
  </style>
</head>
<body>
  <section class="home-page" id="home">
    <h1>The Mythical Whale Stack</h1>
    <p>Embark on a voyage across cosmic seas and clockwork depths to meet legendary leviathans. Swipe sideways (or click arrows) to sail between worlds, then glide upward to reveal their lore.</p>
    <p>Scroll down to begin your odyssey.</p>
    <div class="scroll-indicator"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg></div>
  </section>

  <section class="cards-container" id="cards">
    <div class="card-counter">0/0</div>
  </section>

  <!-- Arrow navigation buttons (desktop) -->
  <button class="nav-btn left" id="nav-left" aria-label="Previous whale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="nav-btn right" id="nav-right" aria-label="Next whale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

  <script>
    const cardsContainer=document.getElementById('cards');
    const cardCounter=document.querySelector('.card-counter');
    const navLeft=document.getElementById('nav-left');
    const navRight=document.getElementById('nav-right');

    let whales=[];
    let currentIndex=0;
    let startX,startY;
    let isCardExpanded=false;

    /* ----------- helpers ----------- */
    const setBg=url=>cardsContainer.style.setProperty('--bg',`url(${url})`);
    const updateCounter=()=>{cardCounter.textContent=`${currentIndex+1}/${whales.length}`;};

    function createCards(){
      whales.forEach((w,idx)=>{
        const card=document.createElement('div');
        card.className='card';
        card.style.zIndex=whales.length-idx;
        card.style.transform=idx===0?'translateX(0)':'translateX(100%)';

        const img=document.createElement('img');img.className='card-image';img.src=w.image;img.alt=w.name;
        const details=document.createElement('div');details.className='card-details';
        details.innerHTML=`<h2>${w.name}</h2><p>${w.description}</p>`;
        card.append(img,details);
        cardsContainer.appendChild(card);

        card.addEventListener('click',e=>{
          if(!isCardExpanded){expand(card);}else{
            if(e.clientY<=img.getBoundingClientRect().bottom){collapse(card);} }
        });
      });
      setBg(whales[0].image);
      updateCounter();
    }

    /* ----------- animation functions ----------- */
    function expand(c){c.classList.add('expanded');isCardExpanded=true;}
    function collapse(c){c.classList.remove('expanded');isCardExpanded=false;}
    function showCard(dir){
      if(!whales.length) return;
      const cards=document.querySelectorAll('.card');
      const current=cards[currentIndex];
      let nextIdx=(currentIndex+dir+whales.length)%whales.length;
      const target=cards[nextIdx];
      // prep target offscreen
      target.style.transition='none';
      target.style.transform=`translateX(${dir>0?100:-100}%)`;
      target.offsetHeight;target.style.transition='';

      current.classList.add(dir>0?'swipe-left':'swipe-right');
      setTimeout(()=>{
        current.style.transform=`translateX(${dir>0?-100:100}%)`;
        current.style.zIndex='0';
        current.classList.remove('swipe-left','swipe-right','expanded');
      },450);

      target.style.transform='translateX(0)';target.style.zIndex='10';
      currentIndex=nextIdx;isCardExpanded=false;updateCounter();setBg(whales[currentIndex].image);
    }

    /* ----------- touch + mouse events ----------- */
    cardsContainer.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;});
    cardsContainer.addEventListener('touchmove',e=>{
      if(startX==null||startY==null) return;
      const diffX=startX-e.touches[0].clientX;
      const diffY=startY-e.touches[0].clientY;
      const currentCard=document.querySelectorAll('.card')[currentIndex];
      if(Math.abs(diffY)>Math.abs(diffX)){
        if(!isCardExpanded&&diffY>60){expand(currentCard);startX=startY=null;}
        else if(isCardExpanded&&diffY<-60){collapse(currentCard);startX=startY=null;}
        return;
      }
      if(!isCardExpanded){ if(diffX>80){showCard(1);startX=startY=null;} else if(diffX<-80){showCard(-1);startX=startY=null;} }
    });
    cardsContainer.addEventListener('touchend',()=>{startX=startY=null;});

    const isTouch='ontouchstart' in window || navigator.maxTouchPoints>0;
    if(!isTouch){
      window.addEventListener('keydown',e=>{ if(isCardExpanded) return; if(e.key==='ArrowRight')showCard(1); if(e.key==='ArrowLeft')showCard(-1);});
      navLeft.addEventListener('click',e=>{
        e.stopPropagation(); // Prevent card click event
        if(!isCardExpanded) showCard(-1);
      });
      navRight.addEventListener('click',e=>{
        e.stopPropagation(); // Prevent card click event
        if(!isCardExpanded) showCard(1);
      });

      // Show/hide nav arrows on mouse move near edges
      let arrowTimeout;
      document.addEventListener('mousemove',e=>{
        const edgeZone=80;
        const w=window.innerWidth;
        if(e.clientX<=edgeZone){
          navLeft.classList.add('visible');
        } else {
          navLeft.classList.remove('visible');
        }
        if(e.clientX>=w-edgeZone){
          navRight.classList.add('visible');
        } else {
          navRight.classList.remove('visible');
        }
        // Optionally, hide both after a short delay if not near edge
        clearTimeout(arrowTimeout);
        if(e.clientX>edgeZone && e.clientX<w-edgeZone){
          arrowTimeout=setTimeout(()=>{
            navLeft.classList.remove('visible');
            navRight.classList.remove('visible');
          },600);
        }
      });
      // Hide arrows initially
      navLeft.classList.remove('visible');
      navRight.classList.remove('visible');
    } else {
      // hide desktop arrows on touch devices
      navLeft.style.display=navRight.style.display='none';
    }

    /* ----------- scroll hero -> cards ----------- */
    document.querySelector('.scroll-indicator').addEventListener('click',()=>document.getElementById('cards').scrollIntoView({behavior:'smooth'}));
    let lastScroll=0;
    window.addEventListener('scroll',()=>{
      const st=window.pageYOffset||document.documentElement.scrollTop;
      const heroH=document.getElementById('home').offsetHeight;
      if(st>heroH/2 && lastScroll<=heroH/2){document.getElementById('cards').scrollIntoView({behavior:'smooth'});} lastScroll=st;
    });

    /* ----------- LOAD JSON file ----------- */
    fetch('whales.json')
      .then(r=>r.json())
      .then(data=>{whales=data;createCards();})
      .catch(err=>console.error('Failed to load whales.json',err));
  </script>
</body>
</html>
